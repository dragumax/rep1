name: Release Workflow

on:
  release:
    types: [published]   # запускается, когда релиз опубликован

jobs:
  create-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip source code
        run: |
          zip -r9 "rep1-${{ github.ref_name }}.zip" . \
            -x "*.git*" ".github/*" "utils/*"   # исключаем служебные папки

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./rep1-${{ github.ref_name }}.zip
          asset_name: rep1-${{ github.ref_name }}-source-code.zip
          asset_content_type: application/zip
